_format_version: "3.0"
_transform: true

# ── Serviços ──────────────────────────────────────────────────────────────────

services:
  # Game Service — REST
  - name: games-rest
    url: http://games-service:4001
    routes:
      - name: games-rest-route
        paths:
          - /games
        strip_path: false
        protocols:
          - http

  # Game Service — WebSocket
  # O Kong faz proxy transparente de WebSocket (upgrade HTTP → WS)
  - name: games-ws
    url: http://games-service:4001
    routes:
      - name: games-ws-route
        paths:
          - /games/socket.io
        strip_path: false
        protocols:
          - http
          - https

  # Wallet Service — REST
  - name: wallets-rest
    url: http://wallets-service:4002
    routes:
      - name: wallets-rest-route
        paths:
          - /wallets
        strip_path: false
        protocols:
          - http

# ── Plugins globais ───────────────────────────────────────────────────────────

plugins:
  # CORS — permite requisições do frontend (localhost:3000)
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # Rate limiting básico (bônus do desafio)
  - name: rate-limiting
    config:
      minute: 120
      policy: local
      fault_tolerant: true
