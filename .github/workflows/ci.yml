name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Testes unitários ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Game Service unit tests
        run: cd services/games && bun test tests/unit

      - name: Run Wallet Service unit tests
        run: cd services/wallets && bun test tests/unit

      - name: Run Frontend tests
        run: cd frontend && bun run test

  # ── Type checking ──────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck Game Service
        run: cd services/games && bun run typecheck

      - name: Typecheck Wallet Service
        run: cd services/wallets && bun run typecheck

      - name: Typecheck Frontend
        run: cd frontend && bunx tsc --noEmit

  # ── Testes E2E ───────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start infrastructure
        run: bun run docker:up
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Aguardando serviços..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/games/health; do sleep 3; done'
          timeout 120 bash -c 'until curl -sf http://localhost:8000/wallets/health; do sleep 3; done'
          echo "✅ Serviços prontos"

      - name: Get test JWT token
        id: jwt
        run: |
          TOKEN=$(curl -s -X POST \
            "http://localhost:8080/realms/crash-game/protocol/openid-connect/token" \
            -d "client_id=crash-game-client" \
            -d "grant_type=password" \
            -d "username=player" \
            -d "password=player123" \
            -d "scope=openid" \
            | jq -r '.access_token')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run E2E tests — Game Service
        env:
          TEST_JWT_TOKEN: ${{ steps.jwt.outputs.token }}
        run: cd services/games && bun test tests/e2e

      - name: Run E2E tests — Wallet Service
        env:
          TEST_JWT_TOKEN: ${{ steps.jwt.outputs.token }}
        run: cd services/wallets && bun test tests/e2e

      - name: Stop infrastructure
        if: always()
        run: bun run docker:down
